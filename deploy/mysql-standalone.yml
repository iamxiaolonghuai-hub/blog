# ============================================================
#  独立共享 MySQL 容器（给服务器上的多个项目共用）
#
#  用法（服务器上，博客项目根目录）：
#    cd /opt/blog
#    docker compose -f deploy/mysql-standalone.yml up -d
#
#  然后启动博客本体（会自动连到这个实例）：
#    docker compose -f deploy/docker-compose.prod.yml up -d
#
#  为什么独立出来：
#    - 更新博客镜像时 docker compose down 不会连带停掉数据库
#    - 多个项目共用一个 MySQL，省内存（MySQL 8 单实例约 400-700MB）
#    - 备份、升级、调优只动一处
#
#  其他项目接入：compose 里 networks.blog-shared 设 external: true，
#                DB_HOST 填 db-mysql
# ============================================================

name: db-shared

services:
  mysql:
    image: mysql:8.0
    container_name: db-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-blog}
      MYSQL_USER: ${DB_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      # ↓ 小内存服务器（2G 及以下）建议保留，防止 MySQL 占满内存被 OOM 杀掉
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
      - --slow-query-log=0
    volumes:
      - db_mysql_data:/var/lib/mysql
      # 首次初始化自动建表；只在数据卷为空时执行一次
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - shared
    # 安全起见不要把 3306 暴露到公网。本地管理用 SSH 隧道：
    #   ssh -L 3306:127.0.0.1:3306 root@服务器
    # 万一确实要临时映射（用完务必删掉）：
    # ports:
    #   - "127.0.0.1:3306:3306"

networks:
  # 固定命名为 blog-shared，博客项目以 external 方式引用同一个网络
  shared:
    name: blog-shared
    driver: bridge

volumes:
  db_mysql_data:
